<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veloz Auto Center | Carros novos e seminovos</title>
  <meta name="description" content="Veloz Auto Center: carros novos e seminovos com procedência, financiamento facilitado e garantia.">
  <style>
    :root {
      --primary: #e63946;
      --primary-dark: #c1121f;
      --dark: #0e0e10;
      --dark-2: #1d1d1f;
      --light: #f5f5f7;
      --gray: #6b6b73;
      --white: #ffffff;
      --radius: 14px;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 80px; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--dark-2);
      background: var(--light);
      line-height: 1.6;
      overflow-x: hidden;
    }
    body.travado { overflow: hidden; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    button, input, select, textarea { font: inherit; }
    .container { width: min(1140px, 92%); margin: 0 auto; position: relative; z-index: 2; }
    section { padding: 80px 0; position: relative; }
    .section-title { text-align: center; margin-bottom: 44px; }
    .section-title h2 { font-size: 2rem; margin-bottom: 8px; }
    .section-title h2::after {
      content: "";
      display: block;
      width: 0;
      height: 3px;
      background: var(--primary);
      margin: 12px auto 0;
      transition: width 1s var(--ease) 0.3s;
    }
    .section-title.visivel h2::after { width: 60px; }
    .section-title p { color: var(--gray); }

    /* Grão de filme sobre toda a página */
    body::before {
      content: "";
      position: fixed;
      inset: -50%;
      pointer-events: none;
      z-index: 900;
      opacity: 0.05;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      animation: grao 0.8s steps(4) infinite;
    }
    @keyframes grao {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-3%, 2%); }
      50% { transform: translate(2%, -3%); }
      75% { transform: translate(-2%, -1%); }
      100% { transform: translate(0, 0); }
    }

    /* Brilho do cursor */
    .glow {
      position: fixed;
      left: 0;
      top: 0;
      width: 460px;
      height: 460px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(230, 57, 70, 0.16), transparent 65%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 800;
      mix-blend-mode: screen;
      transition: opacity 0.4s;
    }
    @media (hover: none) { .glow { display: none; } }

    /* Botões */
    .btn {
      position: relative;
      overflow: hidden;
      display: inline-block;
      background: var(--primary);
      color: var(--white);
      padding: 12px 26px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s var(--ease), box-shadow 0.3s;
    }
    .btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.45), transparent);
      transform: skewX(-20deg);
      transition: left 0.7s var(--ease);
    }
    .btn:hover::after { left: 125%; }
    .btn:hover { background: var(--primary-dark); box-shadow: 0 10px 24px rgba(230, 57, 70, 0.35); transform: translateY(-2px); }
    .btn:active { transform: scale(0.98); }
    .btn-outline { background: transparent; border: 2px solid var(--white); }
    .btn-outline:hover { background: var(--white); color: var(--dark-2); box-shadow: none; }
    .btn-whats { background: #25d366; }
    .btn-whats:hover { background: #1ebe5a; box-shadow: 0 10px 24px rgba(37, 211, 102, 0.35); }

    /* Tela de abertura */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      z-index: 1000;
      transition: opacity 0.9s var(--ease), visibility 0.9s;
    }
    #loader.saiu { opacity: 0; visibility: hidden; }
    .loader-logo {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--white);
      animation: entrarLogo 1.4s var(--ease) both;
    }
    .loader-logo span { color: var(--primary); }
    .barra {
      width: 180px;
      height: 2px;
      background: #2a2a2e;
      overflow: hidden;
    }
    .barra span {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--primary);
      transform: scaleX(0);
      transform-origin: left;
      animation: barra 1.6s var(--ease) forwards;
    }
    @keyframes entrarLogo {
      from { opacity: 0; letter-spacing: 22px; filter: blur(10px); }
      to { opacity: 1; letter-spacing: 4px; filter: blur(0); }
    }
    @keyframes barra { to { transform: scaleX(1); } }

    /* Header */
    header {
      position: sticky;
      top: 0;
      background: rgba(14, 14, 16, 0.92);
      backdrop-filter: blur(8px);
      color: var(--white);
      z-index: 100;
      transition: box-shadow 0.4s;
    }
    header.rolado { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35); }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0;
      position: relative;
      transition: padding 0.4s var(--ease);
    }
    header.rolado .nav { padding: 10px 0; }
    .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 0.5px; }
    .logo span { color: var(--primary); }
    .menu { display: flex; gap: 26px; list-style: none; }
    .menu a { font-weight: 500; position: relative; padding: 4px 0; }
    .menu a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0;
      height: 2px;
      background: var(--primary);
      transition: width 0.4s var(--ease);
    }
    .menu a:hover::after { width: 100%; }
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--white);
      font-size: 1.8rem;
      cursor: pointer;
    }

    /* Hero cinematográfica */
    .hero {
      position: relative;
      min-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--white);
      overflow: hidden;
      background: var(--dark);
    }
    .hero-bg {
      position: absolute;
      inset: -15% 0;
      z-index: 0;
      will-change: transform;
    }
    .hero-img {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 70% 30%, rgba(230, 57, 70, 0.35), transparent 55%),
        linear-gradient(135deg, #1b1f3b 0%, #3a3f5c 45%, #8d99ae 100%);
      animation: kenburns 22s var(--ease) both;
    }
    @keyframes kenburns {
      from { transform: scale(1.2); }
      to { transform: scale(1); }
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.8));
    }
    .hero .container { z-index: 2; padding: 80px 0; }
    .hero-eyebrow {
      display: inline-block;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-size: 0.85rem;
      color: var(--primary);
      margin-bottom: 14px;
      font-weight: 700;
    }
    .hero h1 {
      font-size: 3.4rem;
      line-height: 1.15;
      margin-bottom: 18px;
      perspective: 800px;
    }
    .palavra { display: inline-block; white-space: nowrap; }
    .letra {
      display: inline-block;
      transform-origin: 50% 100%;
      animation: letraSobe 1s var(--ease) both;
      animation-delay: calc(var(--i) * 40ms + 600ms);
    }
    @keyframes letraSobe {
      from { opacity: 0; transform: translateY(70px) rotateX(-85deg); filter: blur(8px); }
      to { opacity: 1; transform: none; filter: blur(0); }
    }
    .hero p.subtitulo {
      font-size: 1.15rem;
      max-width: 640px;
      margin: 0 auto 32px;
      opacity: 0.92;
    }
    .hero-buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .fade-up { animation: subir 1.1s var(--ease) both; }
    .fade-up.a { animation-delay: 1.6s; }
    .fade-up.b { animation-delay: 1.85s; }
    .fade-up.c { animation-delay: 2.1s; }
    @keyframes subir {
      from { opacity: 0; transform: translateY(30px); filter: blur(6px); }
      to { opacity: 1; transform: none; filter: blur(0); }
    }
    /* Hero só anima depois que a tela de abertura sai */
    .hero:not(.iniciar) * { animation-play-state: paused !important; }
    .hero .hero-buttons, .hero .subtitulo { }
    .indicador {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 26px;
      height: 42px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      z-index: 3;
      animation: fadeIn 1s 2.6s both;
    }
    .indicador::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 8px;
      width: 4px;
      height: 8px;
      margin-left: -2px;
      background: var(--white);
      border-radius: 2px;
      animation: rolar 1.8s infinite;
    }
    @keyframes rolar {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(14px); }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Faixa em movimento */
    .faixa {
      background: var(--primary);
      color: var(--white);
      overflow: hidden;
      padding: 16px 0;
      position: relative;
      z-index: 3;
    }
    .trilha {
      display: flex;
      width: max-content;
      animation: marquee 32s linear infinite;
    }
    .trilha span {
      white-space: nowrap;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding-right: 60px;
    }
    .trilha span::after {
      content: "\25C6";
      margin-left: 60px;
      opacity: 0.7;
    }
    @keyframes marquee { to { transform: translateX(-50%); } }

    /* Números */
    .numeros { background: var(--dark-2); color: var(--white); padding: 60px 0; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      text-align: center;
    }
    .stats-grid strong {
      display: block;
      font-size: 3rem;
      font-weight: 800;
      color: var(--white);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .stats-grid strong { background: linear-gradient(90deg, #fff, #ffb3b8); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .stats-grid span { color: #b9b9c2; font-size: 0.95rem; }

    /* Revelação ao rolar */
    .reveal {
      opacity: 0;
      transform: translateY(50px) scale(0.98);
      filter: blur(8px);
      transition:
        opacity 0.9s var(--ease) var(--d, 0ms),
        transform 0.9s var(--ease) var(--d, 0ms),
        filter 0.9s var(--ease) var(--d, 0ms);
    }
    .reveal.visivel { opacity: 1; transform: none; filter: blur(0); }

    /* Estoque */
    .filtros {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 12px;
      background: var(--white);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .filtros input,
    .filtros select {
      padding: 10px 12px;
      border: 1px solid #d0d0d6;
      border-radius: 8px;
      background: var(--white);
      width: 100%;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .filtros input:focus,
    .filtros select:focus,
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus,
    .sim-form input:focus,
    .sim-form select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.2);
    }
    .contador { color: var(--gray); margin-bottom: 20px; font-size: 0.95rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 26px;
      perspective: 1000px;
    }
    .card { height: 100%; }
    .card-inner {
      height: 100%;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.35s var(--ease), box-shadow 0.35s;
      transform-style: preserve-3d;
    }
    .card-inner:hover { box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18); }
    .card-img {
      height: 190px;
      background: linear-gradient(120deg, #3a3f5c, #9a8c98, #4a4e69, #2b2d42);
      background-size: 300% 300%;
      animation: gradienteVivo 9s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: var(--white);
      font-weight: 600;
      text-align: center;
      padding: 10px;
      overflow: hidden;
    }
    .card-img::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.25) 50%, transparent 60%);
      transform: translateX(-100%);
      transition: transform 0.9s var(--ease);
    }
    .card-inner:hover .card-img::after { transform: translateX(100%); }
    @keyframes gradienteVivo {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--primary);
      color: var(--white);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      z-index: 2;
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.5);
      animation: pulsar 2.4s infinite;
    }
    @keyframes pulsar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .card-body { padding: 18px; display: flex; flex-direction: column; flex: 1; }
    .card-body h3 { font-size: 1.15rem; margin-bottom: 8px; }
    .specs {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      color: var(--gray);
      font-size: 0.9rem;
      margin-bottom: 14px;
    }
    .preco { font-size: 1.4rem; font-weight: 800; color: var(--primary); margin-bottom: 14px; }
    .card-body .btn { margin-top: auto; text-align: center; }
    .vazio { text-align: center; color: var(--gray); grid-column: 1 / -1; padding: 40px 0; }

    /* Diferenciais */
    section#diferenciais { background: var(--white); }
    .diferenciais {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
    }
    .dif {
      background: var(--light);
      padding: 30px 22px;
      border-radius: var(--radius);
      text-align: center;
      transition: transform 0.4s var(--ease), background 0.4s, box-shadow 0.4s;
    }
    .dif:hover {
      transform: translateY(-8px);
      background: var(--white);
      box-shadow: var(--shadow);
    }
    .dif .icone {
      font-size: 2.4rem;
      margin-bottom: 12px;
      display: inline-block;
      transition: transform 0.6s var(--ease);
    }
    .dif:hover .icone { transform: rotate(-8deg) scale(1.15); }
    .dif h3 { margin-bottom: 8px; font-size: 1.1rem; }
    .dif p { color: var(--gray); font-size: 0.95rem; }

    /* Simulador */
    .sim-wrapper {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
      align-items: start;
    }
    .sim-form { display: grid; gap: 14px; }
    .sim-form label, .form-group label { font-weight: 600; font-size: 0.95rem; display: block; margin-bottom: 4px; }
    .sim-form input,
    .sim-form select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d0d0d6;
      border-radius: 8px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .resultado {
      background: linear-gradient(135deg, var(--light), #ffffff);
      border-radius: var(--radius);
      padding: 24px;
      min-height: 180px;
      display: flex;
      align-items: center;
      color: var(--gray);
      border: 1px solid #ececf0;
    }
    .resultado.novo { animation: resultadoEntra 0.8s var(--ease); }
    @keyframes resultadoEntra {
      from { opacity: 0; transform: scale(0.96) translateY(10px); filter: blur(4px); }
      to { opacity: 1; transform: none; filter: blur(0); }
    }
    .resultado strong { color: var(--primary); font-size: 1.3rem; }
    .resultado p { margin-bottom: 4px; }
    .erro { color: var(--primary-dark); }

    /* Contato */
    .contato-wrapper {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 40px;
    }
    .info-item { margin-bottom: 22px; }
    .info-item h3 { font-size: 1.05rem; margin-bottom: 4px; }
    .info-item p { color: var(--gray); }
    form.contato-form {
      background: var(--white);
      padding: 30px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: grid;
      gap: 16px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d0d0d6;
      border-radius: 8px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .form-group textarea { min-height: 110px; resize: vertical; }
    .msg-form { font-weight: 600; min-height: 24px; }
    .msg-form.ok { color: #1e8e3e; }
    .msg-form.erro { color: var(--primary-dark); }

    /* Footer */
    footer { background: var(--dark); color: #cfcfd4; padding: 36px 0; text-align: center; }
    footer .logo { color: var(--white); margin-bottom: 8px; display: inline-block; }
    footer p { font-size: 0.9rem; }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s var(--ease), visibility 0.5s;
    }
    .modal.aberto { opacity: 1; visibility: visible; }
    .modal-box {
      background: var(--white);
      border-radius: var(--radius);
      max-width: 620px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      padding: 30px;
      transform: scale(0.85) translateY(40px);
      opacity: 0;
      transition: transform 0.6s var(--ease), opacity 0.5s;
    }
    .modal.aberto .modal-box { transform: none; opacity: 1; }
    .modal-fechar {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: none;
      font-size: 2rem;
      cursor: pointer;
      color: var(--gray);
      transition: transform 0.4s var(--ease), color 0.3s;
    }
    .modal-fechar:hover { color: var(--primary); transform: rotate(90deg); }
    .modal-box h2 { margin-bottom: 6px; }
    .modal-box .preco { margin: 10px 0 16px; }
    .modal-box .specs { grid-template-columns: 1fr 1fr 1fr; margin-bottom: 20px; }
    .modal-box .specs li strong { color: var(--dark-2); display: block; }
    .modal-box .btn { width: 100%; text-align: center; }

    /* Botão flutuante WhatsApp */
    .whats-float {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #25d366;
      color: var(--white);
      padding: 12px 18px;
      border-radius: 30px;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
      z-index: 150;
      transition: transform 0.3s var(--ease), box-shadow 0.3s;
      animation: flutuar 3s ease-in-out infinite;
    }
    .whats-float:hover { transform: scale(1.06); box-shadow: 0 10px 24px rgba(37, 211, 102, 0.45); }
    @keyframes flutuar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Responsividade */
    @media (max-width: 900px) {
      .filtros { grid-template-columns: 1fr 1fr; }
      .sim-wrapper, .contato-wrapper { grid-template-columns: 1fr; }
      .hero h1 { font-size: 2.6rem; }
    }
    @media (max-width: 768px) {
      .menu-toggle { display: block; }
      .menu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--dark);
        flex-direction: column;
        text-align: center;
        gap: 0;
        padding: 10px 0;
      }
      .menu.open { display: flex; }
      .menu li a { display: block; padding: 12px; }
      .menu a::after { display: none; }
      .hero { min-height: 520px; }
      .hero h1 { font-size: 2.1rem; }
      .section-title h2 { font-size: 1.6rem; }
      .modal-box .specs { grid-template-columns: 1fr 1fr; }
      .stats-grid strong { font-size: 2.2rem; }
    }
